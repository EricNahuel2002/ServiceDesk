name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  publish:
    name: Publish API
    runs-on: ubuntu-latest

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "ServiceDesk_Test_SA_2026!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'ServiceDesk_Test_SA_2026!' -C -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore ServiceDesk.sln

      - name: Build
        run: dotnet build ServiceDesk.sln --no-restore --configuration Release

      - name: Test
        env:
          ServiceDesk__TestConnectionString: "Server=localhost,1433;Database=ServiceDesk_Test;User Id=sa;Password=ServiceDesk_Test_SA_2026!;TrustServerCertificate=True;MultipleActiveResultSets=true"
        run: dotnet test ServiceDesk.sln --no-build --configuration Release

      - name: Publish
        run: dotnet publish src/ServiceDesk.Api/ServiceDesk.Api.csproj --no-restore --configuration Release --output "${{ github.workspace }}/publish"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: api
          path: "${{ github.workspace }}/publish"

  migrate:
    name: Apply database migrations
    runs-on: ubuntu-latest
    needs: publish
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef --version "9.0.*"

      - name: Generate idempotent migrations script
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations script --idempotent \
            --project src/ServiceDesk.Infrastructure \
            --startup-project src/ServiceDesk.Api \
            --output migrations.sql

      - name: Upload migrations script
        uses: actions/upload-artifact@v4
        with:
          name: migrations-sql
          path: migrations.sql

      - name: Apply migrations to Azure SQL
        uses: azure/sql-action@v2.4
        with:
          connection-string: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
          path: ./migrations.sql

  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: [publish, migrate]
    environment: production

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: api
          path: ./publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: ./publish
