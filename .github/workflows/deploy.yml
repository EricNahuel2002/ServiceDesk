name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  publish:
    name: Publish API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore ServiceDesk.sln

      - name: Build
        run: dotnet build ServiceDesk.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test ServiceDesk.sln --no-build --configuration Release

      - name: Publish
        run: dotnet publish src/ServiceDesk.Api/ServiceDesk.Api.csproj --no-restore --configuration Release --output "${{ github.workspace }}/publish"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: api
          path: "${{ github.workspace }}/publish"

  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: publish
    environment: production

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: api
          path: ./publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: ./publish
