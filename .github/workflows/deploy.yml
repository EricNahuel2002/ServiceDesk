name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  publish:
    name: Publish API
    runs-on: ubuntu-latest

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "ServiceDesk_Test_SA_2026!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'ServiceDesk_Test_SA_2026!' -C -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore ServiceDesk.sln

      - name: Build
        run: dotnet build ServiceDesk.sln --no-restore --configuration Release

      - name: Test
        env:
          ServiceDesk__TestConnectionString: "Server=localhost,1433;Database=ServiceDesk_Test;User Id=sa;Password=ServiceDesk_Test_SA_2026!;TrustServerCertificate=True;MultipleActiveResultSets=true"
        run: dotnet test ServiceDesk.sln --no-build --configuration Release

      - name: Publish
        run: dotnet publish src/ServiceDesk.Api/ServiceDesk.Api.csproj --no-restore --configuration Release --output "${{ github.workspace }}/publish"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: api
          path: "${{ github.workspace }}/publish"

  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: publish
    environment: production

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: api
          path: ./publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: ./publish

  publish-functions:
    name: Publish Functions
    runs-on: ubuntu-latest
    needs: publish

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Publish
        run: dotnet publish src/ServiceDesk.Functions/ServiceDesk.Functions.csproj --configuration Release --output "${{ github.workspace }}/publish-functions"

      - name: Zip package
        working-directory: "${{ github.workspace }}/publish-functions"
        run: zip -r "${{ github.workspace }}/functions-package.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: functions
          path: "${{ github.workspace }}/functions-package.zip"

  deploy-functions:
    name: Deploy to Azure Functions
    runs-on: ubuntu-latest
    needs: publish-functions
    environment: production

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: functions
          path: ./

      - name: Deploy to Azure Function App
        uses: azure/functions-action@v1
        with:
          app-name: ${{ secrets.AZURE_FUNCTIONSAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_FUNCTIONS_PUBLISH_PROFILE }}
          package: ./functions-package.zip
